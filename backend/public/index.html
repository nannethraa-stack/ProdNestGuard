<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NestGuard Live Infant Monitoring Station</title>
    <!-- Bootstrap CSS for clean hospital-grade UI styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container-fluid py-4">
        <div class="p-3 mb-4 bg-success text-white rounded shadow-sm">
            <h2 class="mb-0">🏥 NestGuard Live Infant Monitoring Station (4-Class AI)</h2>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title mb-3">Real-Time Nursery Telemetry & Granular AI Diagnostics</h5>
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>Timestamp</th>
                                <th>Room / Device</th>
                                <th>Event State</th>
                                <th>Confidence</th>
                                <th>Probabilistic Diagnosis (4-Class)</th>
                                <th>Ammonia (ppm)</th>
                                <th>Diaper Status</th>
                                <th>Max Temp (°C)</th>
                            </tr>
                        </thead>
                        <tbody id="telemetry-table-body">
                            <!-- Live data rows will be dynamically injected here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Socket.io client script served automatically by the backend -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        socket.on('telemetry_update', function(data) {
            const tbody = document.getElementById('telemetry-table-body');
            const row = document.createElement('tr');

            // Dynamically assign badge colors based on 4-class event types
            let badgeClass = 'bg-secondary';
            if (data.event_type.includes('PAIN')) {
                badgeClass = 'bg-danger';
            } else if (data.event_type.includes('HUNGER')) {
                badgeClass = 'bg-warning text-dark';
            } else if (data.event_type.includes('DISCOMFORT')) {
                badgeClass = 'bg-info text-dark';
            } else if (data.event_type.includes('THERMAL') || data.event_type.includes('AMMONIA')) {
                badgeClass = 'bg-danger';
            }

            const timestamp = new Date().toLocaleTimeString();
            const confidenceVal = data.confidence ? (data.confidence * 100).toFixed(1) + '%' : 'N/A';

            row.innerHTML = `
                <td>${timestamp}</td>
                <td><strong>${data.device_id || 'portenta_room_01'}</strong></td>
                <td><span class="badge ${badgeClass}">${data.event_type}</span></td>
                <td>${confidenceVal}</td>
                <td><strong>${data.probabilistic_diagnosis || 'Normal'}</strong></td>
                <td>${data.ammonia_ppm} ppm</td>
                <td><span class="badge ${data.diaper_status && data.diaper_status.includes('SOILED') ? 'bg-danger' : 'bg-success'}">${data.diaper_status}</span></td>
                <td>${data.max_temp} °C</td>
            `;

            // Insert new live updates at the top of the table
            tbody.prepend(row);
        });
    </script>
</body>
</html>
